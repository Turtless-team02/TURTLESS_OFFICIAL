name: Update YouTube latest videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube latest videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          CHANNEL_ID = "UC8QwTy46OaCGdTauiPYkeow"

          def get_json(base_url, params):
              url = base_url + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "TURTLESS-GitHub-Actions/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # 1. 채널의 uploads 플레이리스트 ID 가져오기
          channel_data = get_json(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "contentDetails",
                  "id": CHANNEL_ID,
                  "key": API_KEY
              }
          )

          if not channel_data.get("items"):
              raise RuntimeError(
                  "YouTube 채널을 찾지 못했습니다."
              )

          uploads_id = (
              channel_data["items"][0]
              ["contentDetails"]
              ["relatedPlaylists"]
              ["uploads"]
          )

          # 2. uploads 플레이리스트에서 최신 3개 가져오기
          videos_data = get_json(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_id,
                  "maxResults": 3,
                  "key": API_KEY
              }
          )

          videos = []

          for item in videos_data.get("items", []):
              snippet = item.get("snippet", {})
              content = item.get("contentDetails", {})

              video_id = (
                  content.get("videoId")
                  or snippet.get("resourceId", {}).get("videoId")
              )

              if not video_id:
                  continue

              thumbnails = snippet.get("thumbnails", {})

              thumbnail = (
                  thumbnails.get("maxres", {}).get("url")
                  or thumbnails.get("standard", {}).get("url")
                  or thumbnails.get("high", {}).get("url")
                  or thumbnails.get("medium", {}).get("url")
                  or thumbnails.get("default", {}).get("url")
                  or f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
              )

              videos.append({
                  "videoId": video_id,
                  "title": snippet.get("title", "YouTube Video"),
                  "thumbnail": thumbnail,
                  "link": (
                      f"https://www.youtube.com/watch"
                      f"?v={video_id}"
                  )
              })

          if not videos:
              raise RuntimeError(
                  "가져온 YouTube 영상이 없습니다."
              )

          data = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "items": videos
          }

          with open(
              "youtube-latest.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Updated {len(videos)} YouTube videos."
          )

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube-latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update latest YouTube videos"
            git push
          fi
