name: Update YouTube latest videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube latest videos
        shell: python
        run: |
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          CHANNEL_ID = "UC8QwTy46OaCGdTauiPYkeow"
          FEED_URL = (
              f"https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={CHANNEL_ID}"
          )

          ATOM = "http://www.w3.org/2005/Atom"
          YT = "http://www.youtube.com/xml/schemas/2015"

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          videos = []

          for entry in root.findall(f"{{{ATOM}}}entry")[:3]:
              video_id = entry.findtext(f"{{{YT}}}videoId")
              title = entry.findtext(f"{{{ATOM}}}title")

              link = entry.find(
                  f"{{{ATOM}}}link[@rel='alternate']"
              )

              if link is not None:
                  video_url = link.attrib.get("href")
              else:
                  video_url = (
                      f"https://www.youtube.com/watch?v={video_id}"
                  )

              videos.append({
                  "videoId": video_id,
                  "title": title,
                  "thumbnail": (
                      f"https://i.ytimg.com/vi/"
                      f"{video_id}/hqdefault.jpg"
                  ),
                  "link": video_url
              })

          data = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": videos
          }

          with open(
              "youtube-latest.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Updated {len(videos)} YouTube videos."
          )

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube-latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update latest YouTube videos"
            git push
          fi
